<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>pixel-backdrop</title>
    <meta
      name="description"
      content="A live pixel-grid backdrop: canvas toys shown through an emulated LCD."
    />
    <link rel="stylesheet" href="pixel-backdrop.css" />
    <style>
      :root {
        --base: #f4f4f2;
        --ink: #8a8a99;
        --backdrop-page-color: var(--base);
        color-scheme: light dark;
      }
      body {
        background: var(--base);
        color: var(--ink);
        font: 15px/1.5 ui-monospace, Menlo, monospace;
        margin: 0;
      }
      main {
        background: var(--base);
        box-sizing: border-box;
        margin: 15vh auto;
        max-inline-size: min(22rem, calc(100vw - 2rem));
        padding: 1.25rem 1.5rem;
        position: relative;
      }
      h1,
      h2 {
        font-size: inherit;
        margin: 0;
      }
      h2 {
        margin-block-start: 1.5rem;
      }
      p {
        margin: 0 0 1rem;
      }
      label {
        display: flex;
        justify-content: space-between;
        margin-block: 0.25rem;
      }
      select,
      a {
        color: inherit;
        font: inherit;
      }
      select {
        background: transparent;
        border: 1px solid currentColor;
      }
      #inline {
        margin-block: 0.5rem;
        outline: 1px solid;
        touch-action: none;
      }
      #toggle {
        background: var(--base);
        border: 0;
        color: inherit;
        cursor: pointer;
        inset: auto auto max(1rem, env(safe-area-inset-bottom)) 1rem;
        line-height: 0;
        padding: 0.5rem;
        position: fixed;
      }
      #toggle svg {
        fill: currentColor;
        inline-size: 18px;
        shape-rendering: crispEdges;
      }
      code {
        display: block;
        margin-block: 1rem;
        user-select: all;
      }
      .fps {
        background: var(--base);
        display: grid;
        font-size: 0.8125rem;
        font-variant-numeric: tabular-nums;
        gap: 0.125rem;
        inset: auto 1rem max(1rem, env(safe-area-inset-bottom)) auto;
        justify-items: end;
        padding: 0.25rem 0.5rem;
        position: fixed;
      }
      .fps[hidden] {
        display: none;
      }
      .fps p {
        margin: 0;
      }
      .fps svg {
        background: color-mix(in oklch, currentColor 12%, transparent);
        block-size: 1.25rem;
        inline-size: 6rem;
        margin-block-start: 0.25rem;
        overflow: visible;
      }
      .fps polyline {
        fill: none;
        shape-rendering: crispEdges;
        stroke: currentColor;
        vector-effect: non-scaling-stroke;
      }
    </style>
  </head>
  <body>
    <pixel-backdrop aria-hidden="true">
      <emulated-canvas
        data-width="160"
        data-height="160"
        data-fit="viewport"
      ></emulated-canvas>
    </pixel-backdrop>

    <main id="card">
      <h1>pixel-backdrop</h1>
      <p>Canvas toys on an emulated LCD.</p>
      <h2>Settings</h2>
      <label>Toy <select id="toy"></select></label>
      <label>Display <select id="display"></select></label>
      <label>Shape <select id="shape"></select></label>
      <h2>Inline</h2>
      <emulated-canvas
        id="inline"
        data-width="50"
        data-height="30"
        data-scale="5"
        data-gap="1"
      ></emulated-canvas>
      <code>npm i @carterworks/pixel-backdrop</code>
      <a href="https://github.com/carterworks/pixel-backdrop">GitHub</a>
    </main>

    <button
      id="toggle"
      type="button"
      aria-label="Settings"
      aria-controls="card"
      aria-expanded="true"
    >
      <svg viewBox="0 0 9 9" aria-hidden="true">
        <path
          d="M0 1h9v1H0zM2 0h2v3H2zM0 4h9v1H0zM5 3h2v3H5zM0 7h9v1H0zM2 6h2v3H2z"
        />
      </svg>
    </button>

    <div class="fps" hidden>
      <p id="fps-rate"></p>
      <p id="fps-low"></p>
      <svg viewBox="0 0 60 1" preserveAspectRatio="none" aria-hidden="true">
        <polyline id="fps-history"></polyline>
      </svg>
    </div>

    <script type="module">
      import { TOYS } from "./dist/backdrop-toys/index.js";
      import { SHAPES } from "./dist/emulated-canvas/element.js";
      import DISPLAYS from "./displays.json" with { type: "json" };

      const backdrop = document.querySelector("pixel-backdrop");
      const [toy, display, shape, inline, card, toggle] = [
        "toy",
        "display",
        "shape",
        "inline",
        "card",
        "toggle",
      ].map((id) => document.getElementById(id));
      const fill = (select, entries) =>
        select.append(...entries.map(([value, label]) => new Option(label, value)));

      fill(toy, TOYS.map(({ id, label }) => [id, label]));
      fill(display, Object.keys(DISPLAYS).map((name) => [name, name]));
      fill(shape, SHAPES.map((name) => [name, name]));

      let stopInline = () => {};
      const play = (id) => {
        inline.transition();
        stopInline();
        stopInline = TOYS.find((toy) => toy.id === id).start(inline);
      };
      play(toy.value);

      const dress = ({ base, ink, look }) => {
        const data = {
          shadow: look?.shadow?.opacity,
          shadowX: look?.shadow?.x,
          shadowY: look?.shadow?.y,
          paletteBase: base,
          paletteInk: ink,
          paletteStops: look?.stops?.join(" "),
          paletteLevels: look?.levels,
          paletteDither: look?.dither ? "" : undefined,
          ghostRise: look?.ghostRise,
          ghostFall: look?.ghostFall,
        };
        for (const [key, value] of Object.entries(data)) {
          if (value === undefined) delete inline.dataset[key];
          else inline.dataset[key] = value;
        }
        // The main card shows through a translucent grid, as the screen does on the backdrop.
        inline.style.setProperty("--emulated-canvas-gap-color", look?.grid ?? base);
      };

      const show = (name) => {
        const { base, ink } = DISPLAYS[name];
        document.documentElement.style.setProperty("--base", base);
        document.documentElement.style.setProperty("--ink", ink);
        backdrop.display = DISPLAYS[name];
        dress(DISPLAYS[name]);
      };
      show(display.value);

      toy.onchange = () => {
        backdrop.setToy(toy.value);
        play(toy.value);
      };
      display.onchange = () => show(display.value);
      shape.onchange = () => {
        backdrop.configure({ shape: shape.value });
        inline.dataset.shape = shape.value;
      };
      toggle.onclick = () => {
        card.hidden = !card.hidden;
        toggle.setAttribute("aria-expanded", !card.hidden);
      };

      const SAMPLE_MS = 500;
      const HISTORY_MS = 30_000;
      const SLOTS = HISTORY_MS / SAMPLE_MS;
      const meter = document.querySelector(".fps");
      const [rate, low, history] = ["fps-rate", "fps-low", "fps-history"].map(
        (id) => document.getElementById(id),
      );
      const pad = (fps) => String(Math.round(fps)).padStart(3, " ");
      const gaps = [];
      const rates = [];
      let counted = 0;
      let since;
      let last;
      const count = (now) => {
        if (last !== undefined && now > last) {
          gaps.push({ at: now, ms: now - last });
          counted += 1;
        }
        last = now;
        since ??= now;
        if (now - since >= SAMPLE_MS) {
          while (gaps[0]?.at <= now - HISTORY_MS) gaps.shift();
          rates.push((counted * 1000) / (now - since));
          if (rates.length > SLOTS) rates.shift();
          const slowest = gaps
            .map(({ ms }) => ms)
            .sort((a, b) => b - a)
            .slice(0, Math.ceil(gaps.length / 100));
          const peak = Math.max(...rates);
          rate.textContent = `FPS: ${pad(rates.at(-1))}`;
          low.textContent = `1% low: ${pad((slowest.length * 1000) / slowest.reduce((sum, ms) => sum + ms, 0))}`;
          history.setAttribute(
            "points",
            rates
              .flatMap((value, index) => {
                const x = SLOTS - rates.length + index;
                const y = (peak - value) / peak;
                return [`${x},${y}`, `${x + 1},${y}`];
              })
              .join(" "),
          );
          meter.hidden = false;
          counted = 0;
          since = now;
        }
        requestAnimationFrame(count);
      };
      requestAnimationFrame(count);

      await import("./dist/pixel-backdrop/element.js");
    </script>
  </body>
</html>
